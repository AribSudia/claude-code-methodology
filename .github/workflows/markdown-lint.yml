name: Markdown lint

on:
  pull_request:
    paths:
      - '**/*.md'
  push:
    branches: [main]
    paths:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: markdown-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Advisory, not blocking. markdownlint over 150+ hand-written methodology
      # docs surfaces thousands of cosmetic nits (fence languages, blank-line
      # spacing) that are not worth gating a merge on. continue-on-error keeps
      # this informational — the relaxed .markdownlint.json focuses it on rules
      # that actually matter. (The TODO/FIXME detector below DOES block.)
      - name: markdownlint-cli2 (advisory)
        continue-on-error: true
        uses: DavidAnson/markdownlint-cli2-action@v24.1.0
        with:
          globs: |
            **/*.md
            !node_modules
            !proposals/archive/**
            !.github/**

      - name: Detect TODO / FIXME / XXX in shipped docs
        run: |
          set -euo pipefail
          # Allowed in proposals/archive (historical), .github (templates),
          # tests fixtures (intentional placeholders).
          hits=$(git ls-files '*.md' \
            | grep -v 'proposals/archive/' \
            | grep -v '\.github/' \
            | grep -v 'tests/' \
            | xargs grep -nE '\b(TODO|FIXME|XXX)\b' 2>/dev/null || true)
          if [[ -n "$hits" ]]; then
            echo "::warning::Unresolved TODO/FIXME/XXX markers found:"
            echo "$hits"
          else
            echo "No stray TODO/FIXME/XXX markers in shipped docs."
          fi
