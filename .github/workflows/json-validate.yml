name: JSON validation

on:
  pull_request:
    paths:
      - '**/*.json'
      - '!**/node_modules/**'
  push:
    branches: [main]
    paths:
      - '**/*.json'

permissions:
  contents: read

concurrency:
  group: json-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Validate every committed JSON file
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if ! jq empty "$f" 2>/dev/null; then
              echo "::error file=$f::Invalid JSON"
              fail=1
            else
              echo "ok: $f"
            fi
          done < <(git ls-files '*.json' | grep -v node_modules)
          exit $fail

      - name: Validate VERSION.json schema
        run: |
          set -euo pipefail
          v=$(jq -r '.version' VERSION.json)
          c=$(jq -r '.codename' VERSION.json)
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION.json::version '$v' is not semver"
            exit 1
          fi
          if [[ -z "$c" || "$c" == "null" ]]; then
            echo "::error file=VERSION.json::codename missing"
            exit 1
          fi
          echo "VERSION.json: $v \"$c\""

      - name: Validate .mcp.json shape
        run: jq -e '.mcpServers | type == "object"' .mcp.json

      - name: Validate .claude/settings.json shape
        run: jq -e '.hooks.PreToolUse[0].hooks[0].command' .claude/settings.json
