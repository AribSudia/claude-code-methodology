name: Coherence

on:
  # Required check → runs on every PR to main (see hooks.yml note).
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'VERSION.json'
      - 'CLAUDE.md'
      - '.claude/agents/**'
      - '.claude/skills/**'

permissions:
  contents: read

concurrency:
  group: coherence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-coherence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run coherence validator
        run: |
          chmod +x scripts/validate-coherence.sh
          ./scripts/validate-coherence.sh
