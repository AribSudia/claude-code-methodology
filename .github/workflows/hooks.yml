name: Hooks regression

on:
  # Required check → MUST run on every PR to main, or a PR that doesn't touch
  # these paths blocks forever waiting for a status that never reports.
  pull_request:
    branches: [main]
  push:
    branches:
      - main
    paths:
      - '.claude/hooks/**'
      - '.claude/settings.json'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: hooks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Make hooks executable
        run: chmod +x .claude/hooks/*.sh scripts/*.sh

      - name: Run regression suite
        run: ./scripts/test-hooks.sh

      - name: Verify settings.json is valid JSON
        run: jq empty .claude/settings.json

      - name: Verify .mcp.json is valid JSON
        run: jq empty .mcp.json

      - name: Token audit (informational)
        run: ./scripts/token-audit.sh || true
